name: Build Windows Release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0" pytest

      - name: Run portable application tests
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'muesli-portable-tests'
          python -m pytest tests/test_local_minutes.py tests/test_minutes_pipeline.py tests/test_categories.py tests/test_privacy_settings.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'muesli-chat-test'
          python tests/test_chat.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ui/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "Muesli" `
            --icon "muesli.ico" `
            --add-data "ui;ui" `
            --collect-data "faster_whisper" `
            --collect-data "ctranslate2" `
            --hidden-import "truststore" `
            --hidden-import "pystray._win32" `
            --hidden-import "webview.platforms.winforms" `
            --hidden-import "webview.platforms.edgechromium" `
            launch.py

      - name: Copy runtime config and package the local CPU and Vulkan engines
        run: |
          Copy-Item Muesli.exe.config dist\Muesli\Muesli.exe.config
          & .\scripts\install-minutes-runtime.ps1 -Destination (Join-Path $PWD 'dist\Muesli\llama-runtime')
          & .\scripts\install-minutes-runtime.ps1 -Backend vulkan -Destination (Join-Path $PWD 'dist\Muesli\llama-runtime-vulkan')

      - name: Test build components
        run: |
          .\dist\Muesli\Muesli.exe --selftest
        continue-on-error: true

      - name: Package Artifact
        run: |
          Compress-Archive -Path dist\Muesli\* -DestinationPath Muesli-windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muesli-windows-x64
          path: Muesli-windows-x64.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Muesli-windows-x64.zip
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
          body: |
            - Atas offline com Qwen3 4B Instruct (2,50 GB): ata executiva ou treinamento/palestra.
            - Fila retomável por blocos, prévia parcial e referências à transcrição.
            - CPU por padrão. Aceleração experimental em Intel UHD/Iris via Vulkan, com fallback para CPU.
            - Para testar: Configurações → IA → Atas locais → Tentar GPU integrada Intel.
            - O download do modelo é separado do ZIP. Para transcrever sem rede, use também o Whisper local.
            - Sessões de até seis horas foram exercitadas com transcrições sintéticas e respostas simuladas. O desempenho em gravações reais depende do equipamento.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
