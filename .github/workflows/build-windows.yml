name: Build Windows Release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set release name and Windows version resource
        shell: pwsh
        run: |
          $version = (python -c "from muesli import APP_VERSION; print(APP_VERSION)").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid APP_VERSION' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION $version"
          }
          $name = "Muesli-windows-x64-v$version"
          $numbers = ($version -split '\.') -join ', '
          @"
          VSVersionInfo(
            ffi=FixedFileInfo(filevers=($numbers, 0), prodvers=($numbers, 0),
                              mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[StringFileInfo([StringTable('040904B0', [
                StringStruct('FileDescription', 'Muesli for Windows'),
                StringStruct('FileVersion', '$version'),
                StringStruct('OriginalFilename', '$name.exe'),
                StringStruct('ProductName', 'Muesli'),
                StringStruct('ProductVersion', '$version')])]),
                VarFileInfo([VarStruct('Translation', [1033, 1200])])])
          "@ | Set-Content -Path windows-version.txt -Encoding utf8
          "MUESLI_VERSION=$version" >> $env:GITHUB_ENV
          "MUESLI_DIST_NAME=$name" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.9,<7" pytest

      - name: Run portable application tests
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'muesli-portable-tests'
          python -m pytest tests/test_local_minutes.py tests/test_minutes_pipeline.py tests/test_categories.py tests/test_privacy_settings.py tests/test_windows_release.py tests/test_update_install.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'muesli-chat-test'
          python tests/test_chat.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ui/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "$env:MUESLI_DIST_NAME" `
            --version-file windows-version.txt `
            --icon "muesli.ico" `
            --add-data "ui;ui" `
            --collect-data "faster_whisper" `
            --collect-data "ctranslate2" `
            --hidden-import "truststore" `
            --hidden-import "pystray._win32" `
            --hidden-import "webview.platforms.winforms" `
            --hidden-import "webview.platforms.edgechromium" `
            launch.py

      - name: Copy runtime config and package the local CPU and Vulkan engines
        run: |
          $dir = Join-Path $PWD "dist\$env:MUESLI_DIST_NAME"
          Copy-Item Muesli.exe.config (Join-Path $dir "$env:MUESLI_DIST_NAME.exe.config")
          & .\scripts\install-minutes-runtime.ps1 -Destination (Join-Path $dir 'llama-runtime')
          & .\scripts\install-minutes-runtime.ps1 -Backend vulkan -Destination (Join-Path $dir 'llama-runtime-vulkan')

      - name: Test build components
        run: |
          $dir = Join-Path $PWD "dist\$env:MUESLI_DIST_NAME"
          $exe = Get-Item (Join-Path $dir "$env:MUESLI_DIST_NAME.exe")
          if ($exe.VersionInfo.FileVersion -ne $env:MUESLI_VERSION -or $exe.VersionInfo.ProductVersion -ne $env:MUESLI_VERSION) {
            throw "Incorrect version metadata: $($exe.VersionInfo.FileVersion) / $($exe.VersionInfo.ProductVersion)"
          }
          Write-Host "Verified $($exe.Name) version $($exe.VersionInfo.FileVersion)"
          $test = Start-Process -FilePath $exe.FullName -ArgumentList '--selftest' -Wait -PassThru
          $result = Get-Content (Join-Path $dir 'selftest.json') -Raw | ConvertFrom-Json
          if ($test.ExitCode -ne 0 -or -not $result.ok) {
            throw "Executable self-test failed: $($result.error)"
          }
          Remove-Item (Join-Path $dir 'selftest.json')

      - name: Package Artifact
        run: |
          Compress-Archive -Path "dist\$env:MUESLI_DIST_NAME\*" -DestinationPath "$env:MUESLI_DIST_NAME.zip"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            # Updaters before v1.6.1 use a fixed filename if the Releases API is unavailable.
            Copy-Item "$env:MUESLI_DIST_NAME.zip" Muesli-windows-x64.zip
          }

      - name: Verify the package can be staged and run without the original folder
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'muesli-update-smoke'
          python -c "from pathlib import Path; import sys; from muesli.updater import extract_package; extract_package(Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3])" "$env:MUESLI_DIST_NAME.zip" $stage "v$env:MUESLI_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $stage "$env:MUESLI_DIST_NAME.exe"
          $test = Start-Process -FilePath $exe -WorkingDirectory $stage -ArgumentList '--selftest' -Wait -PassThru
          $result = Get-Content (Join-Path $stage 'selftest.json') -Raw | ConvertFrom-Json
          if ($test.ExitCode -ne 0 -or -not $result.ok) { throw 'The staged update did not pass the self-test' }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MUESLI_DIST_NAME }}
          path: ${{ env.MUESLI_DIST_NAME }}.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.MUESLI_DIST_NAME }}.zip
            Muesli-windows-x64.zip
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
          body: |
            - NVIDIA NIM em Configurações → Modelos de IA: chave separada da OpenAI, modelo configurável e botão Testar conexão que envia apenas uma frase de exemplo.
            - Selecione NVIDIA NIM (nuvem) explicitamente para usar o provedor no chat e no aprimoramento normal. Essas ações podem enviar texto à NVIDIA; a transcrição e a fila de Atas locais não mudam.
            - A partir da v1.6.3, use Configurações → Atualizações para baixar e depois escolha Instalar e reiniciar. Na v1.6.2 ou anterior, baixe `${{ env.MUESLI_DIST_NAME }}.zip`, extraia a pasta inteira e abra `${{ env.MUESLI_DIST_NAME }}.exe`.
            - `Muesli-windows-x64.zip` contém o mesmo pacote e mantém a compatibilidade com atualizadores antigos.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
